proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Forwarded-Host $marketplace_forwarded_host;
proxy_set_header X-Forwarded-Proto $marketplace_forwarded_proto;
proxy_set_header X-Forwarded-Port $marketplace_forwarded_port;
proxy_set_header X-Forwarded-For $marketplace_forwarded_for;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Request-ID $request_id;
proxy_set_header Connection "";
proxy_ssl_server_name on;
proxy_ssl_name $proxy_host;
proxy_ssl_verify on;
proxy_ssl_trusted_certificate /etc/ssl/cert.pem;
proxy_connect_timeout 5s;
proxy_send_timeout 75s;
proxy_read_timeout 75s;
