services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: marketplace
      POSTGRES_PASSWORD: marketplace
      POSTGRES_DB: marketplace
    ports:
      - "5432:5432"
    volumes:
      - marketplace_pgdata:/var/lib/postgresql/data

  clamav:
    image: clamav/clamav:1.5
    restart: unless-stopped
    # clamd speaks unauthenticated, unencrypted TCP; keep it reachable only from this PC.
    ports:
      - "127.0.0.1:3310:3310"
    volumes:
      - marketplace_clamav_db:/var/lib/clamav

volumes:
  marketplace_pgdata:
  marketplace_clamav_db:
