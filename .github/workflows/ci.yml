name: ci
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://marketplace:marketplace@127.0.0.1:5432/marketplace_e2e_ci?schema=public
      E2E_DATABASE_URL: postgresql://marketplace:marketplace@127.0.0.1:5432/marketplace_e2e_ci?schema=public
      PASSWORD_PEPPER: ci-test-only-placeholder-pepper-123456
      CONTENT_SCAN_REQUIRED: 'true'
      SITE_URL: http://127.0.0.1:4000
      WEB_ORIGIN: http://127.0.0.1:5173
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: marketplace
          POSTGRES_PASSWORD: marketplace
          POSTGRES_DB: marketplace_e2e_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U marketplace -d marketplace_e2e_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:deploy
      - run: npm run db:seed
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Run CMS browser tests
        env:
          NODE_ENV: development
          API_PORT: 4000
        run: npm run e2e
