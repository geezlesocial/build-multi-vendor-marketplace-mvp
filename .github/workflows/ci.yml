name: ci
on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PASSWORD_PEPPER: ci-test-only-placeholder-pepper-123456
      CONTENT_SCAN_REQUIRED: "true"
      SITE_URL: http://127.0.0.1:4000
      WEB_ORIGIN: http://127.0.0.1:5173
      FORMAT_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before || 'origin/main' }}
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: marketplace
          POSTGRES_PASSWORD: marketplace
          POSTGRES_DB: postgres
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U marketplace -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.4
          cache: npm
      - name: Create isolated per-run test database
        shell: bash
        env:
          PGPASSWORD: marketplace
        run: |
          sandbox_id="$(printf '%s:%s' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" | sha256sum | cut -c1-32)"
          database_name="wallet_funding_e2e_${sandbox_id}"
          createdb --host=127.0.0.1 --port=55432 --username=marketplace "$database_name"
          {
            echo "WALLET_FUNDING_SANDBOX_ID=${sandbox_id}"
            echo "DATABASE_URL=postgresql://marketplace:marketplace@127.0.0.1:55432/${database_name}?schema=public"
            echo "E2E_DATABASE_URL=postgresql://marketplace:marketplace@127.0.0.1:55432/${database_name}?schema=public"
          } >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:deploy
      - run: npm run db:seed
      - run: npm run lint
      - run: node --test scripts/format-base.test.mjs
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:coverage -w apps/api
      - name: Retain API coverage summary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: marketplace-api-coverage-${{ github.sha }}
          path: apps/api/coverage/coverage-summary.json
          if-no-files-found: error
          retention-days: 14
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Run CMS browser tests
        env:
          NODE_ENV: development
          API_PORT: 4000
        run: npm run e2e
      - name: Retain Playwright report and attached theme screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: marketplace-playwright-report-${{ github.sha }}
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14
