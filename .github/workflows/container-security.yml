name: Marketplace container security (non-deploying)

on:
  pull_request:
  push:
    branches:
      - infra/marketplace-azure-staging-prep
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-scan:
    name: Audit, build, and scan immutable local images
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DATABASE_URL: postgresql://127.0.0.1:5432/not-used?schema=public
      CONTENT_SCAN_REQUIRED: "true"
      LIVE_SHOPPING_AVAILABLE: "false"
      WALLET_FUNDING_PROVIDER_READY: "false"
      MONEY_MOVEMENT_HARD_DISABLED: "true"
    steps:
      - name: Check out exact source commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up pinned Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.4
          cache: npm

      - name: Generate ephemeral validation values
        shell: bash
        run: |
          set -euo pipefail
          db_password="$(openssl rand -hex 32)"
          app_pepper="$(openssl rand -hex 32)"
          echo "::add-mask::$db_password"
          echo "::add-mask::$app_pepper"
          {
            echo "STAGING_TEST_DB_PASSWORD=$db_password"
            echo "STAGING_TEST_PASSWORD_PEPPER=$app_pepper"
            echo "STAGING_TEST_DB_NAME=marketplace_config_validation"
            echo "STAGING_TEST_CONTAINER_DATABASE_URL=postgresql://marketplace_test:${db_password}@postgres:5432/marketplace_config_validation?schema=public"
            echo "PASSWORD_PEPPER=$app_pepper"
          } >> "$GITHUB_ENV"

      - name: Install exact lockfile graph
        run: npm ci --no-audit --fund=false

      - name: Audit production dependency graph (machine-readable)
        shell: bash
        run: |
          set +e
          npm audit --omit=dev --json > "$RUNNER_TEMP/marketplace-npm-audit.json" 2>"$RUNNER_TEMP/marketplace-npm-audit-stderr.txt"
          set -e
          node scripts/npm-audit-policy.mjs "$RUNNER_TEMP/marketplace-npm-audit.json"

      - name: Verify lock integrity and pinned base images
        run: node scripts/container-image-integrity.test.mjs

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Lint, typecheck, unit test, and build
        run: |
          npm run lint
          npm run source:size:check
          npm run typecheck
          npm run test -w apps/api -- --maxWorkers=2 --testTimeout=15000
          npm run build

      - name: Test proxy TLS/header configuration and redacted diagnostics
        run: |
          node infra/containers/nginx-proxy-config.test.mjs
          node infra/containers/safe-console.test.mjs

      - name: Validate staging Compose configuration
        run: docker compose -f docker-compose.staging-test.yml config --quiet

      - name: Build API runtime image from this commit
        run: docker build --pull -f apps/api/Dockerfile --target runtime -t marketplace-api:${GITHUB_SHA} .

      - name: Build isolated Prisma migration image from this commit
        run: docker build --pull -f apps/api/Dockerfile --target migrator -t marketplace-migrator:${GITHUB_SHA} .

      - name: Build React/Nginx web image from this commit
        run: docker build --pull -f apps/web/Dockerfile -t marketplace-web:${GITHUB_SHA} .

      - name: Install verified Trivy CLI from the official release
        shell: bash
        run: |
          set -euo pipefail
          tag="$(curl --fail --silent --show-error --location --retry 3 --retry-all-errors \
            https://api.github.com/repos/aquasecurity/trivy/releases/latest \
            | node -e 'let body="";process.stdin.on("data",chunk=>body+=chunk).on("end",()=>{const tag=JSON.parse(body).tag_name;if(!/^v[0-9]+[.][0-9]+[.][0-9]+$/.test(tag))process.exit(1);process.stdout.write(tag);})')"
          version="${tag#v}"
          case "$(uname -m)" in
            x86_64) release_arch="64bit" ;;
            aarch64) release_arch="ARM64" ;;
            *) echo "Unsupported Trivy runner architecture: $(uname -m)" >&2; exit 1 ;;
          esac
          archive="trivy_${version}_Linux-${release_arch}.tar.gz"
          release_url="https://github.com/aquasecurity/trivy/releases/download/${tag}"
          install_dir="$RUNNER_TEMP/trivy-bin"
          mkdir -p "$install_dir"
          curl --fail --silent --show-error --location --retry 3 --retry-all-errors \
            "$release_url/$archive" -o "$RUNNER_TEMP/$archive"
          curl --fail --silent --show-error --location --retry 3 --retry-all-errors \
            "$release_url/trivy_${version}_checksums.txt" -o "$RUNNER_TEMP/trivy-checksums.txt"
          expected="$(awk -v file="$archive" '$2 == file { print $1; exit }' "$RUNNER_TEMP/trivy-checksums.txt")"
          if [[ ! "$expected" =~ ^[[:xdigit:]]{64}$ ]]; then
            echo "Official Trivy checksum missing or malformed for $archive" >&2
            exit 1
          fi
          printf '%s  %s\n' "$expected" "$RUNNER_TEMP/$archive" | sha256sum --check --status
          tar -xzf "$RUNNER_TEMP/$archive" -C "$install_dir" trivy
          echo "$install_dir" >> "$GITHUB_PATH"
          "$install_dir/trivy" version | grep -F "Version: $version"

      - name: Scan source tree for secrets (report stays on ephemeral runner)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          skip-setup-trivy: true
          skip-dirs: .git,node_modules,apps/api/dist,apps/web/dist
          format: json
          output: ${{ runner.temp }}/source-secrets.json
          exit-code: "0"
          hide-progress: true

      - name: Scan API runtime image (fixed and unfixed findings)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: marketplace-api:${{ github.sha }}
          scanners: vuln,secret
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          format: json
          output: ${{ runner.temp }}/api-trivy.json
          exit-code: "0"
          hide-progress: true
          skip-setup-trivy: true

      - name: Scan Prisma migration image (fixed and unfixed findings)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: marketplace-migrator:${{ github.sha }}
          scanners: vuln,secret
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          format: json
          output: ${{ runner.temp }}/migrator-trivy.json
          exit-code: "0"
          hide-progress: true
          skip-setup-trivy: true

      - name: Scan React/Nginx image (fixed and unfixed findings)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: marketplace-web:${{ github.sha }}
          scanners: vuln,secret
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          format: json
          output: ${{ runner.temp }}/web-trivy.json
          exit-code: "0"
          hide-progress: true
          skip-setup-trivy: true

      - name: Generate CycloneDX SBOMs for every deployable image
        shell: bash
        run: |
          set -euo pipefail
          for spec in "api:marketplace-api" "migrator:marketplace-migrator" "web:marketplace-web"; do
            name="${spec%%:*}"
            image="${spec#*:}"
            trivy image --scanners vuln --format cyclonedx --output "sbom-${name}.cdx.json" "${image}:${GITHUB_SHA}"
          done

      - name: Enforce no HIGH/CRITICAL or secret findings and record local immutable image IDs
        shell: bash
        run: |
          node scripts/trivy-policy.mjs \
            "$RUNNER_TEMP/source-secrets.json" \
            "$RUNNER_TEMP/api-trivy.json" \
            "$RUNNER_TEMP/migrator-trivy.json" \
            "$RUNNER_TEMP/web-trivy.json"
          {
            echo "### Local image identity"
            echo "Source commit: \`$GITHUB_SHA\`"
            echo '| Image tag | Local immutable OCI image ID |'
            echo '|---|---|'
            for image in "marketplace-api:$GITHUB_SHA" "marketplace-migrator:$GITHUB_SHA" "marketplace-web:$GITHUB_SHA"; do
              printf '| `%s` | `%s` |\n' "$image" "$(docker image inspect --format '{{.Id}}' "$image")"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Retain SBOMs for security review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: marketplace-container-sboms-${{ github.sha }}
          path: sbom-*.cdx.json
          if-no-files-found: error
          retention-days: 14

  local-service-integration:
    name: Container network, Mailpit, ClamAV, and proxy integration
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DATABASE_URL: postgresql://127.0.0.1:5432/not-used?schema=public
      CONTENT_SCAN_REQUIRED: "true"
      STORE_EMAIL_DELIVERY_AVAILABLE: "false"
      LIVE_SHOPPING_AVAILABLE: "false"
      WALLET_FUNDING_PROVIDER_READY: "false"
      MONEY_MOVEMENT_HARD_DISABLED: "true"
      STAGING_TEST_DB_PORT: "55439"
      STAGING_TEST_API_PORT: "4001"
      STAGING_TEST_WEB_PORT: "5174"
      STAGING_TEST_MAILPIT_API_PORT: "18025"
      STAGING_TEST_MAILPIT_PORT: "11025"
      STAGING_TEST_CLAMAV_PORT: "13310"
    steps:
      - name: Check out exact source commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up pinned Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.4
          cache: npm

      - name: Generate ephemeral validation values
        shell: bash
        run: |
          set -euo pipefail
          db_password="$(openssl rand -hex 32)"
          app_pepper="$(openssl rand -hex 32)"
          echo "::add-mask::$db_password"
          echo "::add-mask::$app_pepper"
          {
            echo "STAGING_TEST_DB_PASSWORD=$db_password"
            echo "STAGING_TEST_PASSWORD_PEPPER=$app_pepper"
            echo "PASSWORD_PEPPER=$app_pepper"
          } >> "$GITHUB_ENV"

      - name: Install and build isolated integration harness
        run: |
          npm ci --no-audit --fund=false
          npm run db:generate
          npm run build

      - name: Create a unique disposable database and start local-only dependencies
        shell: bash
        run: |
          set -euo pipefail
          sandbox_id="$(printf '%s:%s' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" | sha256sum | cut -c1-32)"
          database_name="wallet_funding_e2e_${sandbox_id}"
          export STAGING_TEST_DB_NAME="$database_name"
          export COMPOSE_PROJECT_NAME="marketplace-services-${sandbox_id}"
          container_database_url="postgresql://marketplace_test:${STAGING_TEST_DB_PASSWORD}@postgres:5432/${database_name}?schema=public"
          host_database_url="postgresql://marketplace_test:${STAGING_TEST_DB_PASSWORD}@127.0.0.1:${STAGING_TEST_DB_PORT}/${database_name}?schema=public"
          export STAGING_TEST_CONTAINER_DATABASE_URL="$container_database_url"
          echo "STAGING_TEST_DB_NAME=$database_name" >> "$GITHUB_ENV"
          echo "COMPOSE_PROJECT_NAME=$COMPOSE_PROJECT_NAME" >> "$GITHUB_ENV"
          echo "STAGING_TEST_CONTAINER_DATABASE_URL=$container_database_url" >> "$GITHUB_ENV"
          echo "WALLET_FUNDING_SANDBOX_ID=$sandbox_id" >> "$GITHUB_ENV"
          echo "DATABASE_URL=$host_database_url" >> "$GITHUB_ENV"
          echo "E2E_DATABASE_URL=$host_database_url" >> "$GITHUB_ENV"
          docker compose -f docker-compose.staging-test.yml --profile session-services up -d postgres mailpit
          ready=false
          for attempt in $(seq 1 60); do
            if docker compose -f docker-compose.staging-test.yml exec -T postgres pg_isready -U marketplace_test -d postgres >/dev/null 2>&1; then ready=true; break; fi
            sleep 2
          done
          if [[ "$ready" != true ]]; then
            docker compose -f docker-compose.staging-test.yml ps
            docker compose -f docker-compose.staging-test.yml logs --no-color postgres
            exit 1
          fi
          docker compose -f docker-compose.staging-test.yml exec -T postgres pg_isready -U marketplace_test -d "$database_name"

      - name: Apply migrations in the isolated migrator container and seed the disposable database
        run: |
          docker compose -f docker-compose.staging-test.yml --profile migrations run --build --rm migrator
          npm run db:seed

      - name: Start the API and Nginx web containers on the private Compose network
        run: |
          set -euo pipefail
          docker compose -f docker-compose.staging-test.yml --profile session-services up -d --build api web clamav
          ready=false
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:${STAGING_TEST_WEB_PORT}/healthz >/dev/null && \
               curl --fail --silent http://127.0.0.1:${STAGING_TEST_WEB_PORT}/ready >/dev/null; then ready=true; break; fi
            sleep 2
          done
          if [[ "$ready" != true ]]; then
            docker compose -f docker-compose.staging-test.yml ps
            docker compose -f docker-compose.staging-test.yml logs --no-color --tail=100 api web postgres clamav
            exit 1
          fi
          curl --fail --silent --show-error http://127.0.0.1:${STAGING_TEST_WEB_PORT}/healthz
          curl --fail --silent --show-error http://127.0.0.1:${STAGING_TEST_WEB_PORT}/ready >/dev/null

      - name: Verify actual API-container SMTP and ClamAV network paths
        run: node scripts/staging-container-network-smoke.mjs

      - name: Verify same-origin proxy routing and secure session behavior
        env:
          STAGING_SMOKE_BASE_URL: http://127.0.0.1:${{ env.STAGING_TEST_WEB_PORT }}
        run: node scripts/staging-proxy-smoke.mjs

      - name: Verify production web image in a real browser
        run: |
          npx playwright install --with-deps chromium
          npx playwright test --config=playwright.container.config.ts

      - name: Verify Mailpit capture, real ClamAV verdicts, quarantine, and cleanup
        env:
          STAGING_TEST_CLAMAV_HOST: 127.0.0.1
          STAGING_TEST_CLAMAV_PORT: ${{ env.STAGING_TEST_CLAMAV_PORT }}
          STAGING_TEST_MAILPIT_HOST: 127.0.0.1
          STAGING_TEST_MAILPIT_PORT: ${{ env.STAGING_TEST_MAILPIT_PORT }}
          STAGING_TEST_MAILPIT_API: http://127.0.0.1:${{ env.STAGING_TEST_MAILPIT_API_PORT }}
        run: |
          node scripts/staging-services-smoke.mjs
          node --import tsx scripts/media-scanning-api.test.mjs

      - name: Verify admin onboarding upload, scan, publish, member refresh, and restore with real ClamAV
        env:
          E2E_BASE_URL: http://127.0.0.1:${{ env.STAGING_TEST_WEB_PORT }}
          E2E_WEB_PORT: ${{ env.STAGING_TEST_WEB_PORT }}
          E2E_API_PORT: ${{ env.STAGING_TEST_API_PORT }}
          E2E_REAL_CLAMAV: "true"
          E2E_CLAMAV_HOST: 127.0.0.1
          E2E_CLAMAV_PORT: ${{ env.STAGING_TEST_CLAMAV_PORT }}
          E2E_REUSE_EXISTING_SERVERS: "true"
          ONBOARDING_EVIDENCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: npx playwright test e2e/onboarding-experience.spec.ts --project=default --grep "real ClamAV onboarding upload"

      - name: Capture onboarding ClamAV scanner logs
        if: always()
        shell: bash
        run: |
          set +e
          docker compose -f docker-compose.staging-test.yml --profile session-services logs --no-color clamav > clamav-onboarding.log 2>&1
          scanner_logs_status=$?
          if [ "$scanner_logs_status" -ne 0 ]; then
            echo "Scanner log collection exited with status $scanner_logs_status." >> clamav-onboarding.log
          fi
          {
            echo "### Real-ClamAV onboarding acceptance evidence"
            echo "PR source commit: ${{ github.event.pull_request.head.sha || github.sha }}"
            echo "Workflow checkout commit: $GITHUB_SHA"
            echo "Scanner log collection exit: $scanner_logs_status"
            echo "The Playwright HTML report, traces, and attached audit evidence are retained with this run's artifact."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Retain real-ClamAV onboarding acceptance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: onboarding-clamav-acceptance-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
            clamav-onboarding.log
          if-no-files-found: warn
          retention-days: 14

      - name: Destroy the disposable Compose environment
        if: always()
        run: docker compose -f docker-compose.staging-test.yml --profile session-services down --volumes --remove-orphans
