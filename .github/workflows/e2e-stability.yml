name: Marketplace full E2E stability

on:
  workflow_dispatch:
  push:
    branches:
      - fix/marketplace-release-completion

permissions:
  contents: read

jobs:
  browser-suite:
    name: Full browser suite (pass ${{ matrix.pass }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pass: [1, 2, 3]
    env:
      PASSWORD_PEPPER: e2e-stability-only-placeholder-pepper-123456
      CONTENT_SCAN_REQUIRED: 'true'
      SITE_URL: http://127.0.0.1:4000
      WEB_ORIGIN: http://127.0.0.1:5173
    services:
      postgres:
        image: postgres:17-alpine@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
        env:
          POSTGRES_USER: marketplace
          POSTGRES_PASSWORD: local-only-disposable-password
          POSTGRES_DB: postgres
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U marketplace -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out exact source commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up pinned Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.4
          cache: npm

      - name: Create a unique disposable E2E database
        shell: bash
        run: |
          set -euo pipefail
          sandbox_id="$(printf '%s:%s:%s' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" '${{ matrix.pass }}' | sha256sum | cut -c1-32)"
          database_name="wallet_funding_e2e_${sandbox_id}"
          PGPASSWORD=local-only-disposable-password createdb --host=127.0.0.1 --port=55432 --username=marketplace "$database_name"
          {
            echo "WALLET_FUNDING_SANDBOX_ID=${sandbox_id}"
            echo "DATABASE_URL=postgresql://marketplace:local-only-disposable-password@127.0.0.1:55432/${database_name}?schema=public"
            echo "E2E_DATABASE_URL=postgresql://marketplace:local-only-disposable-password@127.0.0.1:55432/${database_name}?schema=public"
          } >> "$GITHUB_ENV"

      - name: Install exact lockfile graph
        run: npm ci --no-audit --fund=false

      - name: Generate Prisma client, migrate and seed only the disposable database
        run: |
          npm run db:generate
          npm run db:deploy
          npm run db:seed

      - name: Install browser runtime
        run: npx playwright install --with-deps chromium

      - name: Run the complete browser suite
        env:
          NODE_ENV: development
        run: npm run e2e
