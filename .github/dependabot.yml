version: 2
updates:
  # The root lockfile is shared by the npm workspace packages.
  - package-ecosystem: npm
    directories:
      - /
      - /apps/api
      - /apps/web
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
